[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aus-accounting-mcp"
version = "0.1.0"
description = "MCP facade over payday-super-checker and ato-benchmark-compare for Australian computational accounting."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Ryan Duguid", email = "ryan@duguid.com.au" }
]
keywords = [
    "model-context-protocol",
    "mcp-server",
    "australian-tax",
    "ato-benchmarks",
    "payday-super",
    "accounting-ai",
]
dependencies = [
    "mcp>=2.0.0,<3",
    "payday-super-checker @ git+https://github.com/ryanduguid/CharlesHenryWickens.git@4e60756de85cb0d06aa9c5ca2c4193b72a5802a3",
    "ato-benchmark-compare @ git+https://github.com/ryanduguid/RaymondChambers.git@64e165378d1cebb55d611f3675894c0630120f34",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
]

[project.scripts]
aus-accounting-mcp = "aus_accounting_mcp.cli:main"

[project.urls]
Homepage = "https://github.com/ryanduguid/JohnKenley"
Repository = "https://github.com/ryanduguid/JohnKenley.git"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["aus_accounting_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
